---
# ==============================================================================
# Role: common - Tasks
# Base OS configuration, security hardening, and Kubernetes prerequisites
# ==============================================================================

- name: Update APT repository cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: [common, update]

- name: Install fundamental system utilities
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - git
      - unzip
      - jq
      - net-tools
      - software-properties-common
      - fontconfig
    state: present
  tags: [common, packages]

# ------------------------------------------------------------------------------
# Kubernetes Node Prerequisites (if self-managed EC2/kubeadm is used)
# ------------------------------------------------------------------------------
- name: Disable swap immediately (Kubernetes requirement)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: false
  tags: [common, k8s-prereqs]

- name: Permanently disable swap in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'
  tags: [common, k8s-prereqs]

- name: Load required kernel modules for container networking
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  tags: [common, k8s-prereqs]

- name: Ensure kernel modules persist across system reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'
  tags: [common, k8s-prereqs]

- name: Configure sysctl parameters for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/k8s.conf
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }
  notify: reload sysctl
  tags: [common, k8s-prereqs]
