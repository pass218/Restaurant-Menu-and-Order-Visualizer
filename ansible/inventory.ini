[jenkins_servers]
# Replace <JENKINS_PUBLIC_IP> with: $(terraform -chdir=../terraform output -raw jenkins_public_ip)
jenkins_node ansible_host=13.233.100.51 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[ansible_nodes]
# Replace <ANSIBLE_PUBLIC_IP> with: $(terraform -chdir=../terraform output -raw ansible_public_ip)
ansible_control ansible_host=13.233.100.52 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[k8s_nodes]
# Optional self-managed EC2 worker nodes (if using kubeadm instead of AWS managed EKS)
# node01 ansible_host=10.0.11.101 ansible_user=ubuntu
# node02 ansible_host=10.0.12.102 ansible_user=ubuntu

[ci_cd:children]
jenkins_servers
ansible_nodes

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
