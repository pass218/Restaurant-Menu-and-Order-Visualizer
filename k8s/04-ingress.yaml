# ==============================================================================
# Kubernetes Ingress Manifest
# Supports AWS Load Balancer Controller (ALB) and Community NGINX Ingress
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurant-menu-ingress
  namespace: restaurant-app
  labels:
    app: restaurant-menu
    app.kubernetes.io/name: restaurant-menu
  annotations:
    # AWS Load Balancer Controller Annotations
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: "/health.html"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    # Optional SSL redirection (when ACM certificate ARN is provided):
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    # Production Custom Domain Routing
    - host: menu.restaurant-visualizer.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: restaurant-menu-service
                port:
                  number: 80
    # Catch-all Wildcard Rule (Enables access directly via AWS ALB DNS address)
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: restaurant-menu-service
                port:
                  number: 80
