<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Check - Restaurant Menu & Order Visualizer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem 3rem;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
      margin-bottom: 1rem;
    }
    h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; }
    p { margin: 0.25rem 0; color: #94a3b8; font-size: 0.9rem; }
    pre {
      background: #0f172a;
      padding: 0.85rem;
      border-radius: 6px;
      text-align: left;
      font-size: 0.85rem;
      color: #38bdf8;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" id="health-badge">● HEALTHY</div>
    <h1>Service Status: UP</h1>
    <p>Application: Restaurant Menu & Order Visualizer</p>
    <p>Target Cloud: AWS (ap-south-1) | Kubernetes Container</p>
    <pre id="json-status">{
  "status": "UP",
  "service": "restaurant-menu-order-visualizer",
  "timestamp": "2026-09-30T23:18:00Z",
  "version": "1.0.0",
  "http_code": 200
}</pre>
  </div>
</body>
</html>
