# ==============================================================================
# Production NGINX Configuration - Non-Root Unprivileged Hardened Setup
# Service: Restaurant Menu & Order Visualizer
# ==============================================================================

# Run worker processes automatically based on available CPU cores
worker_processes auto;

# Store PID in unprivileged /tmp location
pid /tmp/nginx.pid;

# Set open file limits for high-throughput container environments
events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Define temporary file paths in non-root writeable directory (/tmp)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Suppress NGINX version string in Server header

    # Structured JSON log format for fluentd/CloudWatch/Prometheus scraping
    log_format json_combined escape=json
      '{'
        '"time_local":"$time_local",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
      '}';

    # Direct logs to standard output/error for container runtime collectors
    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    # Enable Gzip compression to minimize payload bandwidth
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        # Unprivileged non-root port
        listen 8080;
        server_name localhost _;

        root /usr/share/nginx/html;
        index index.html;

        # Hardened HTTP Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self';" always;

        # Health Probe Endpoints for Kubernetes Liveness / Readiness & AWS ALB
        location = /health {
            try_files /health.html =200;
            access_log off;
        }

        location = /health.html {
            try_files /health.html =404;
            access_log off;
        }

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"UP","service":"restaurant-menu-order-visualizer","region":"ap-south-1"}';
            access_log off;
        }

        # Menu Data JSON endpoint
        location = /menu.json {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files /menu.json =404;
        }

        # Static assets cache rules (CSS, JS, Fonts, Images)
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform, max-age=604800";
            access_log off;
        }

        # Single-Page Application (SPA) routing fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Custom 404 & 50x error responses
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
