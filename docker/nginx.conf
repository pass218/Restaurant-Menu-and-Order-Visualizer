# ==============================================================================
# Desi Tadka — Hardened Non-Root NGINX Production Configuration
# Target: AWS ap-south-1 (Mumbai) / Kubernetes Ingress / Docker
# ==============================================================================

# Run worker processes automatically based on CPU cores
worker_processes auto;

# Store PID in unprivileged /tmp location for non-root execution
pid /tmp/nginx.pid;

# Event loop parameters for high concurrency
events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Map WebP extension explicitly if not present in standard mime.types
    types {
        image/webp webp;
    }

    # Non-root writeable temporary paths (avoiding /var/cache/nginx permission issues)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Core performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens   off; # Suppress NGINX version string in HTTP headers

    # Structured JSON log format for CloudWatch / Fluentd / Prometheus scraping
    log_format json_combined escape=json
      '{'
        '"time_local":"$time_local",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
      '}';

    # Send logs to stdout/stderr for Docker/K8s container log drivers
    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    # Enable Gzip compression to minimize bandwidth for text assets
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        # Unprivileged non-root listening port
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Hardened HTTP Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self';" always;

        # Dedicated 30-day Cache-Control for dish images
        location /images/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
            try_files $uri =404;
        }

        # Menu Data JSON endpoint
        location = /menu.json {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files /menu.json =404;
        }

        # General static assets caching (CSS, JS, Fonts)
        location ~* \.(css|js|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform, max-age=604800";
            access_log off;
        }

        # Kubernetes Liveness, Readiness & AWS ALB Health Check Probes
        location = /health {
            try_files /health.html =200;
            access_log off;
        }

        location = /health.html {
            try_files /health.html =404;
            access_log off;
        }

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"UP","service":"desi-tadka-menu-visualizer","region":"ap-south-1"}';
            access_log off;
        }

        # Single-Page Application (SPA) routing fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Custom Error Pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
